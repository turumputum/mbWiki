# Схема подключения модуля button_smartLed: кнопка с адресной подсветкой 300-004.
# Генерация:  python tools/scheme_gen/generate.py "<этот файл>"
#
# Адреса пинов: device:<id>:<pin> | module:<имя>:<pin> | power:<pin> | psu:<pin>
# Цвет провода задаётся ОДИН раз -> совпадает с обоих концов жгута.
#
# Лента WS2812 питается от V+ (Vbus или 5 В по перемычке JP1), данные — sLed;
# контакт кнопки между Bt и gnd.

controller:
  name: ModuleBox
  serial: ""
  server: false
  connectors: [Ethernet, USB]
  modules:
    - name: button_smartLed
      slot: s_0
      pins: ["V+", sLed, Bt, gnd]
  power_module:
    name: Power
    pins: ["+", "-"]
  psu:
    name: "Блок питания\n5 В"
    pins: ["+5", gnd]

devices:
  - id: btn
    name: "Кнопка с адресной подсветкой\n300-004"
    pins: ["+V", DIN, Bt, gnd]

harnesses:
  - id: 1
    label: "кнопка с подсветкой"
    wires:
      - {a: "module:button_smartLed:V+",   b: "device:btn:+V",  color: red}
      - {a: "module:button_smartLed:sLed", b: "device:btn:DIN", color: green}
      - {a: "module:button_smartLed:Bt",   b: "device:btn:Bt",  color: yellow}
      - {a: "module:button_smartLed:gnd",  b: "device:btn:gnd", color: black}
  - id: 2
    label: "питание контроллера"
    wires:
      - {a: "psu:+5",  b: "power:+", color: red}
      - {a: "psu:gnd", b: "power:-", color: black}
